# pre-commit (https://pre-commit.com): the deterministic checks on the staged changes, no model, instant.
# Needs the pr-guard binary on PATH.
- id: pr-guard
  name: pr-guard
  description: Secrets, sensitive paths, destructive SQL and size on the staged changes.
  entry: pr-guard check --staged --no-model
  language: system
  pass_filenames: false
  stages: [pre-commit]

# The same without installing anything: runs in the published image (needs Docker).
- id: pr-guard-docker
  name: pr-guard (Docker)
  description: Secrets, sensitive paths, destructive SQL and size on the staged changes.
  entry: ghcr.io/typestrict-lab/pr-guard:0.1.0 check --staged --no-model
  language: docker_image
  pass_filenames: false
  stages: [pre-commit]
