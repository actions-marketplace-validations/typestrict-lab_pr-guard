# Bitrise step. In a workflow, until it is in the StepLib:
#   - git::https://github.com/typestrict-lab/pr-guard.git@v0.1.0:
#       inputs:
#         - mode: shadow
# (Bitrise reads step.yml from the repository root; the StepLib PR copies this directory there.)
title: pr-guard
summary: Decide how many reviewers a pull request needs, with TS-PRGuard and a YAML policy.
description: |-
  Installs a released pr-guard binary (checked against its SHA-256), runs `pr-guard check` on the pull request against
  its merge base with the target branch, and writes the findings as JUnit to the test reports. The step never runs code
  from the pull request: it only reads the diff the Git Clone step already brought (clone with full history).
website: https://github.com/typestrict-lab/pr-guard
source_code_url: https://github.com/typestrict-lab/pr-guard
support_url: https://github.com/typestrict-lab/pr-guard/issues
project_type_tags: []
type_tags:
  - test
is_always_run: false
is_skippable: false
toolkit:
  bash:
    entry_file: step.sh
deps:
  brew:
    - name: curl
  apt_get:
    - name: curl
inputs:
  - version: "0.1.0"
    opts:
      title: pr-guard release
      is_required: true
  - mode: ""
    opts:
      title: Mode
      summary: "shadow (report, never fail) or enforce; empty keeps the policy's mode."
      value_options: ["", shadow, enforce]
  - policy: .github/pr-guard.yml
    opts:
      title: Policy file
      summary: A missing file means the default policy.
  - args: ""
    opts:
      title: Extra arguments
      summary: Extra arguments for `pr-guard check` (for example `--no-model`).
outputs:
  - PR_GUARD_EXIT_CODE:
      opts:
        title: 0 passed, 1 blocked by the policy, 2 error.
  - PR_GUARD_COMMENT_PATH:
      opts:
        title: Path of the sticky comment's markdown.
